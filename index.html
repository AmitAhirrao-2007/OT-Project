<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EV Route Planner — Professional Automotive Navigation</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ev_planner_display_v2');
          var theme = saved ? JSON.parse(saved).theme : 'light';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface-canvas text-content-primary overflow-hidden select-none transition-colors duration-150">
    <div id="root" class="h-screen w-screen overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
